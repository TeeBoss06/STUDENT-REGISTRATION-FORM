<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>University Portal</h1>
        <p>Please fill out the form below to register for the upcoming academic semester.</p>
    </header>

    <main>
        <section aria-labelledby="form-title">
            <h2 id="form-title">Student Registration Form</h2>
            
            <form action="/submit-registration" method="POST">
                
                <!-- Personal Information Section -->
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <p>
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="firstName" required autocomplete="given-name">
                    </p>
                    
                    <p>
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="lastName" required autocomplete="family-name">
                    </p>
                    
                    <p>
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dateOfBirth" required>
                    </p>
                    
                    <p>
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="">-- Select Option --</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </p>
                </fieldset>

                <!-- Contact Information Section -->
                <fieldset>
                    <legend>Contact Information</legend>
                    
                    <p>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </p>
                    
                    <p>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required autocomplete="tel">
                    </p>
                    
                    <p>
                        <label for="address">Home Address:</label>
                        <textarea id="address" name="address" rows="3" required autocomplete="street-address"></textarea>
                    </p>
                </fieldset>

                <!-- Academic Details Section -->
                <fieldset>
                    <legend>Academic Information</legend>
                    
                    <p>
                        <label for="course">Course of Study:</label>
                        <select id="course" name="course" required>
                            <option value="">-- Select a Course --</option>
                            <option value="computer-science">Computer Science</option>
                            <option value="engineering">Engineering</option>
                            <option value="business-administration">Business Administration</option>
                            <option value="biological-sciences">Biological Sciences</option>
                        </select>
                    </p>

                    <p>
                        <label for="enrollment-type">Enrollment Type:</label>
                        <br>
                        <input type="radio" id="full-time" name="enrollmentType" value="full-time" checked>
                        <label for="full-time">Full-Time</label>
                        <br>
                        <input type="radio" id="part-time" name="enrollmentType" value="part-time">
                        <label for="part-time">Part-Time</label>
                    </p>

                    <p>
                        <label for="start-semester">Preferred Start Semester:</label>
                        <input type="month" id="start-semester" name="startSemester" required>
                    </p>
                </fieldset>

                <!-- Terms and Submission Section -->
                <fieldset>
                    <legend>Review & Submit</legend>
                    
                    <p>
                        <input type="checkbox" id="terms" name="termsAgreement" required>
                        <label for="terms">I declare that all information provided is accurate and true.</label>
                    </p>
                    
                    <p>
                        <button type="submit">Submit Registration</button>
                        <button type="reset">Clear Form</button>
                    </p>
                </fieldset>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 University Portal. All rights reserved.</p>
    </footer>

</body>
</html>
